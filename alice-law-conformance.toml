[G8]
status = "fail-known"
evidence = ["src/fixed_point.rs:33", "src/fixed_point.rs:158", "src/world.rs:132", "src/crdt.rs:51"]
since = ""
note = "Law-bearing fixed-point values are written to a durable form with no persisted-meaning identifier. Fixed (src/fixed_point.rs:33) and Vec3Fixed (src/fixed_point.rs:158) derive Serialize / Deserialize, and Entity (src/world.rs:132) derives Serialize with position: Vec3Fixed, so world state persists fixed-point values directly; LwwRegister<V> (src/crdt.rs:51) serializes a generic register documented for entity position (the counters at crdt.rs:104/165 hold integer counts in a BTreeMap, not fixed-point). None stamps an identifier into the bytes describing the meaning of the stored fixed-point values. src/event.rs is not the durable fixed-point site: its serialized EventKind carries i16 deltas, and delta_to_fixed / fixed_to_delta (event.rs:78-92) convert to and from Vec3Fixed only at the boundary. The gate's mechanism -- a persisted-id format distinct from an in-process one, with a roundtrip test -- does not exist, and depends on G6 (no identifier defined yet)."
reference_repo = ""

