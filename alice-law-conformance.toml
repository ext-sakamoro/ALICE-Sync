[G4]
status = "pass"
evidence = ["tests/float_edge_golden.rs", ".github/workflows/ci.yml test job", ".github/workflows/release-profile.yml", "scripts/run_tests.sh"]
mutant = "flip one pinned bit in tests/float_edge_golden.rs (e.g. the to_bits expectation in signed_zero_both_map_to_raw_zero_and_return_as_positive_zero) -> it fails on every leg, in the debug test matrix and in the release-profile legs"
since = ""
note = "the float-boundary cases are pinned against fixed bit patterns and run under both profiles and both arches. tests/float_edge_golden.rs pins the exact output bits (to_bits) or the exact Q16.16 raw value for every place a float enters or leaves the fixed-point core -- Fixed::from_f32 / to_f32, Vec3Fixed, the stats ratios (BandwidthStats, ReliableEndpoint::loss_rate), telemetry averages, the cloud AABB -- including the signed-zero cases (signed_zero_both_map_to_raw_zero_and_return_as_positive_zero), with expected values derived by hand from the conversion law, not from the function under test. DEBUG: the ci.yml test matrix runs cargo test on ubuntu-latest (x86_64), macos-latest (aarch64) and windows-latest (x86_64), which runs float_edge_golden. RELEASE: .github/workflows/release-profile.yml runs scripts/run_tests.sh float_edge_golden,analytic_oracle -- then cargo test --release on ubuntu-latest (x86_64) and macos-latest (aarch64). So the {debug, release} x {x86_64, aarch64} matrix is covered, and run_tests.sh fails when a named test file ran 0 tests."
reference_repo = ""

