[G6]
status = "fail-known"
evidence = ["src/lib.rs", "src/physics_bridge.rs"]
since = ""
note = "the crate defines no SEMANTICS_ID of its own and folds no upstream identifier: a scan of src finds no SEMANTICS_ID constant and no re-export of one, even though it bridges alice-physics (which carries alice-det-math's arithmetic identifier). Whether alice-sync's deterministic state needs its own meaning identifier folding the pins it depends on (and the bridged producers' ids), or whether its fixed-point determinism is identified some other way, is the design question C4 opens for this crate; located at the absence of any identifier in src/lib.rs and the un-checked bridge boundary in src/physics_bridge.rs."
reference_repo = ""

[G7]
status = "fail-known"
evidence = ["src/physics_bridge.rs:93", "src/physics_bridge.rs:130", "bindings/ue5/AliceSync.h", "bindings/unity/AliceSync.cs"]
since = ""
note = "Law-bearing values cross the crate boundary with no producer-identifier handshake. src/physics_bridge.rs converts InputFrame <-> FrameInput (the i16 -> Fix128 input conversion, around line 93) and SimulationChecksum -> WorldHash (around line 130) between alice-sync and alice-physics with no check of a G6 identifier and no distinctly-typed mismatch error; the C-ABI bindings (bindings/ue5/AliceSync.h, bindings/unity/AliceSync.cs) are a second type-erasing boundary. The gate's mechanism -- a handshake error type and a mismatch test -- does not exist here, and depends on G6 (there is no identifier to carry yet)."
