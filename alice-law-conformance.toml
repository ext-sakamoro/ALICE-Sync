# ALICE-Law conformance manifest for this crate (alice-sync). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository; a `pass` or `n/a` entry also names
# the red mutant that turns the evidence red.
#
# Entries here are written from what this repository's own commits, CI
# workflows and test suites actually show at origin/main, checked directly
# rather than assumed: a gate without concrete evidence is `unverified`, not
# guessed `pass`. alice-sync is a deterministic P2P synchronization crate; its
# Law-bearing state is fixed-point (crate::fixed_point, Q16.16 Fixed /
# Vec3Fixed) and integer hashing (FNV-1a, crate::determinism), and it consumes
# arithmetic from alice-physics / alice-det-math through optional bridge
# features rather than computing transcendentals itself. This is an initial
# manifest: the three machine-gated cells that hold today are recorded as
# pass, the located gaps as fail-known, and the cells whose audit (whether any
# float path is Law-bearing, the release/golden legs) is not yet done as
# unverified. The README Law-integration block is a separate follow-up, after
# the release-train roster entry lands.

