note = "the clock / RNG forms the gate must see ARE covered -- clippy.toml bans std::time::Instant::now, std::time::SystemTime::now and std::collections::hash_map::RandomState::new (CI runs cargo clippy --all-targets -D warnings), and scripts/entropy_guard.py is a lexical second layer over src with scripts/test_entropy_guard.py as its canary (the one permitted read is the transport monotonic clock behind crate::clock::now at src/clock.rs:18, a scoped allow the guard records) -- BUT one form is a checker hole that neither layer reads: Instant::elapsed / SystemTime::elapsed (an elapsed() call reads the wall clock yet is not in clippy's disallowed-methods list nor in the guard's patterns; reproduced across crates). Per ALICE-Law's state definition a checker hole is unverified, not pass: the gate does not see .elapsed(). This flips back to pass when 89's elapsed port (the clippy entry plus its canary) lands in this repo -- Sync is 2nd in that order (DB then Sync). It is not fail-known because there is no located offending .elapsed() call in this crate's non-test code; it is the ban that is absent, not a violation present."
