note = "every public accessor whose iteration can reach Law-bearing output now backs onto an ordered collection, so its order is a deterministic function of the keys, independent of insertion order and OS hash seeding. Converted (per 6e's Law-reachability ruling): node peers to BTreeMap<NodeId, Peer> (NodeId derives Ord), cloud_bridge devices to BTreeMap<u64, DeviceInfo>, channel subscribers to BTreeSet<SocketAddr>, discovery peers to BTreeMap<SocketAddr, PeerInfo> (returned in order by live_peers / peer_addrs, rule c) and discovery metadata to BTreeMap<String, String> (iterated into the mDNS TXT record, rule a; register_peer keeps its HashMap parameter and collects into the ordered field on store, so callers and the mdns path are unchanged). tests/g13_order_determinism.rs is the oracle per site: four cases insert in a scrambled order and assert the sorted key order. Left as-is because no iteration reaches output (grep: no iter / values / keys / drain on the map that feeds output): channel topics (HashMap<Topic, _>, keyed subscribe / publish only), and the reliability pending / timestamps and transport self.peers rustc_hash::FxHashMap (fixed seed, keyed get / insert / remove, no iteration). crdt already uses BTreeMap / BTreeSet and world is Vec-indexed. A static lint banning std HashMap / HashSet in the Law modules would be an additional ratchet (C6); the oracles are the per-site order-independence tests the gate names."
