[package]
name = "alice-sync"
version = "0.7.0"
edition = "2021"
rust-version = "1.88"  # alice-auth 0.5.1 が 1.88 要求、CI msrv job で実 compile
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "LicenseRef-Proprietary"
publish = false
description = "P2P synchronization via event diffing, not data transfer"
repository = "https://github.com/ext-sakamoro/ALICE-Sync"
keywords = ["p2p", "sync", "distributed", "compression", "alice"]
categories = ["network-programming", "compression"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bitcode = "0.6"
tokio = { version = "1.0", features = ["full"], optional = true }
wide = "0.7"
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
numpy = { version = "0.28", optional = true }
# bridge 系 sibling は全て crates.io 公開済なので version 依存 (2026-09-17:
# CI の manifest-only stub は version 0.1.0 固定で ^1 / ^0.5 等を満たせず 09-14 から red)
alice-physics = { version = "3.0", optional = true }
alice-db = { version = "0.2.0-beta.2", optional = true }
alice-cache = { version = "0.2", optional = true }
alice-auth = { version = "0.5.1", optional = true, default-features = false, features = ["std"] }
alice-codec = { version = "0.1.3", optional = true, default-features = false, features = ["std"] }
alice-analytics = { version = "0.3", optional = true, default-features = false, features = ["std"] }
mdns-sd = { version = "0.11", optional = true }
# signed events (authorship): the author's device certificate and its checkpoint signatures; Ed25519 and
# SHA-256 from alice-sign, both by git at a full commit
alice-identity = { version = "1.2.0", git = "https://github.com/ext-sakamoro/ALICE-Identity", rev = "4932418d959456a618b4a01619ec3a25c3542aa2" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "8a1b00d800082187a8693732a9ffb806c98814e7" }

[dev-dependencies]
criterion = "0.5"
# tests/determinism_golden.rs: SHA-256 of the golden scenarios (the pins of SYNC_SEMANTICS_ID)
sha2 = "0.10"
tempfile = "3.10"

[features]
default = ["std"]
std = []
async = ["tokio"]  # Transport, discovery, pub/sub, session driver
simd = []
python = ["pyo3", "numpy"]  # Python bindings (PyO3 + NumPy zero-copy)
physics = ["alice-physics"]  # ALICE-Physics bridge (InputFrame ↔ FrameInput, rollback)
telemetry = ["alice-db"]    # Sync telemetry recording via ALICE-DB
cache = ["alice-cache"]     # Entity state prefetching via Markov oracle
auth = ["alice-auth"]       # P2P peer authentication with Ed25519 ZKP
codec = ["dep:alice-codec", "std"]  # ALICE-Codec wavelet compression for event streams
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics sync telemetry
# Serialize / Deserialize on the Law-bearing fixed-point types (Fixed, Vec3Fixed,
# Entity, WorldState, WorldStorage) with no identifier in the bytes: not a durable
# format. Durable state goes through alice_sync::persist, which stamps SYNC_SEMANTICS_ID
serde-raw = []
ffi = ["std"]     # C-ABI FFI for Unity/UE5
cloud = ["std"]  # Cloud-side multi-device spatial synchronization
mdns = ["dep:mdns-sd", "async"]  # mDNS LAN auto-discovery
all-bridges = ["physics", "telemetry", "cache", "auth", "codec", "analytics"]  # All integration bridges

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process (Unity / UE5) ごと落ちる
strip = true

[[bench]]
name = "sync_bench"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
