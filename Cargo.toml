[package]
name = "alice-sync"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"  # alice-auth 0.5.1 が 1.88 要求、CI msrv job で実 compile
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
license = "LicenseRef-Proprietary"
publish = false
description = "P2P synchronization via event diffing, not data transfer"
repository = "https://github.com/ext-sakamoro/ALICE-Sync"
keywords = ["p2p", "sync", "distributed", "compression", "alice"]
categories = ["network-programming", "compression"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bitcode = "0.6"
tokio = { version = "1.0", features = ["full"], optional = true }
wide = "0.7"
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
numpy = { version = "0.28", optional = true }
# bridge 系 sibling は全て crates.io 公開済なので version 依存 (2026-09-17:
# CI の manifest-only stub は version 0.1.0 固定で ^1 / ^0.5 等を満たせず 09-14 から red)
alice-physics = { git = "https://github.com/ext-sakamoro/ALICE-Physics", branch = "main", version = "4", optional = true }
alice-db = { version = "0.6.0", git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", optional = true }
alice-cache = { version = "0.2", git = "https://github.com/ext-sakamoro/ALICE-Cache", branch = "main", optional = true }
alice-auth = { version = "0.6.0", git = "https://github.com/ext-sakamoro/ALICE-Auth", branch = "main", optional = true, default-features = false, features = ["std"] }
alice-codec = { version = "0.2.0", git = "https://github.com/ext-sakamoro/ALICE-Codec", branch = "main", optional = true, default-features = false, features = ["std"] }
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7", optional = true, default-features = false, features = ["std"] }
mdns-sd = { version = "0.11", optional = true }
# the secure transport: the channel (feature secure-transport)
alice-channel = { version = "0.1.0", git = "https://github.com/ext-sakamoro/ALICE-Channel", rev = "a3809b013c535ce9703dad8fe3329b33afae7508", features = ["async"], optional = true }
# signed events (authorship) and the secure transport: the device certificates and the checkpoint
# signatures; Ed25519 and SHA-256 from alice-sign (ALICE repositories taken by git from main, as their
# other consumers take them, so a build with downstream consumers links one copy of each; the lock is the pin)
alice-identity = { version = "3.0", git = "https://github.com/ext-sakamoro/ALICE-Identity", rev = "8c3ef375d401c4f7ac321cbfc3d2518c99841473" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main" }

[dev-dependencies]
criterion = "0.5"
# tests/determinism_golden.rs: SHA-256 of the golden scenarios (the pins of SYNC_SEMANTICS_ID)
sha2 = "0.10"
tempfile = "3.10"

[features]
default = ["std"]
std = []
async = ["tokio"]  # Transport, discovery, pub/sub, session driver
simd = []
python = ["pyo3", "numpy"]  # Python bindings (PyO3 + NumPy zero-copy)
physics = ["alice-physics"]  # ALICE-Physics bridge (InputFrame ↔ FrameInput, rollback)
crdt-db = ["dep:alice-db"]  # store and reload CRDT state (crdt) through ALICE-DB
telemetry = ["dep:alice-db"]    # Sync telemetry recording via ALICE-DB
cache = ["alice-cache"]     # Entity state prefetching via Markov oracle
auth = ["alice-auth"]       # P2P peer authentication with Ed25519 ZKP
codec = ["dep:alice-codec", "std"]  # ALICE-Codec wavelet compression for event streams
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics sync telemetry
# Serialize / Deserialize on the Law-bearing fixed-point types (Fixed, Vec3Fixed,
# Entity, WorldState, WorldStorage) with no identifier in the bytes: not a durable
# format. Durable state goes through alice_sync::persist, which stamps SYNC_SEMANTICS_ID
serde-raw = []
ffi = ["std"]     # C-ABI FFI for Unity/UE5
cloud = ["std"]  # Cloud-side multi-device spatial synchronization
secure-transport = ["async", "dep:alice-channel"]  # SyncTransport over the authenticated, encrypted channel
mdns = ["dep:mdns-sd", "async"]  # mDNS LAN auto-discovery
all-bridges = ["physics", "telemetry", "cache", "auth", "codec", "analytics"]  # All integration bridges

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process (Unity / UE5) ごと落ちる
strip = true

[[bench]]
name = "sync_bench"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
