    { path = "std::thread::available_parallelism", reason = "the combination order of work on several threads depends on scheduling and thread count (ALICE-Law G13)" },
]

disallowed-types = [
    # disallowed-methods cannot name RandomState::default (a trait method, not
    # reachable via the implementing type's path alone); naming the type itself
    # here catches ::default() too, along with any other explicit naming (a type
    # annotation, a turbofish), without touching HashMap::new's own internal
    # (unnamed) use of RandomState.
    { path = "std::collections::hash_map::RandomState", reason = "seeds from OS randomness and makes HashMap iteration order differ between runs; see disallowed-methods for RandomState::new" },
    # ALICE-Law G13: unspecified iteration order and threads; a reviewed site carries an allow
    # with its reason and is listed in scripts/order_allowlist.toml
    { path = "std::collections::HashMap", reason = "iteration order is unspecified and differs between runs (ALICE-Law G13); use BTreeMap / BTreeSet, or list a membership-only site in scripts/order_allowlist.toml with an allow and its reason" },
