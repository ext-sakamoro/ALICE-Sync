# G1 (no libm direct) and G10 (no run-varying artifacts) for the type-resolved layer:
# CI runs `cargo clippy --all-targets -D warnings`, which turns disallowed-methods into a red gate.
#
# The first list is ALICE-Law's banned list of f32/f64 methods (conformance/gates.toml, G1):
# platform transcendentals are not correctly rounded by IEEE 754 and differ between targets.
# Not listed on purpose: sqrt, mul_add, floor, ceil, round, trunc, abs, copysign (specified exactly).
# powi is banned by default (unspecified association order of the multiplication tree).
#
# The last three are G10: the wall clock and OS-seeded hashing. The transport layer reads the
# monotonic clock in one place (src/clock.rs, one scoped allow); scripts/entropy_guard.py is the
# second layer over src/ and pins that count.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::tan", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
