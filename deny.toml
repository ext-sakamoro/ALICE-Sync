# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を ALICE-Codec 経由で ALICE-Sync 用に調整
#
# ALICE-Sync 自体は AGPL-3.0-or-later (target-side self exception 必須、canonical 罠 #7 target 版)
# sibling stubs (alice-ml/alice-db/alice-crypto/alice-cache) は alice-stubs action で
# "MIT OR Apache-2.0" で生成される (canonical 罠 #2 予防)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.15 unmaintained (pyo3-macros transitive、python feature 有効時のみ)
    # canonical 罠 #15
    "RUSTSEC-2024-0436",
    # crossbeam-epoch unmaintained (transitive、canonical 罠 #15 参照)
    "RUSTSEC-2026-0204",
    # rkyv 0.7 Rc/Arc archive validation OOB: alice-db (db feature、local path dep) の archived 型に
    # Rc/Arc 無し = 非該当 (CI では alice-db は stub のため出現しない、local --all-features 用)
    "RUSTSEC-2026-0235",
    # bincode 1.x unmaintained (alice-db 経由 transitive、alice-db 側で ignore 済と同期)
    "RUSTSEC-2025-0141",
    # pyo3 経由の既知 advisory (python feature 有効時のみ、0.29 移行で解消)
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow (0.24.1+ で fix)
    "RUSTSEC-2026-0176",  # nth/nth_back out-of-bounds read
    "RUSTSEC-2026-0177",  # PyCFunction::new_closure Sync 欠落
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",   # weak copyleft OK
    "OpenSSL",
    # Font-related licenses (font pipeline は現状無いが将来的な transitive 予防、canonical 罠 #14)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # LLVM ecosystem (libfuzzer-sys 経由、canonical 罠 #14)
    "NCSA",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ALICE-Sync 自身 (target crate) が AGPL-3.0-or-later だが cargo-deny は target も
# license check 対象にするため exception で自己許可
# (canonical [[reference_alice_ci_canonical_template]] 罠 #7 の target-side 版)
[[licenses.exceptions]]
name = "alice-sync"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# AGPL bridge dep (crates.io、optional feature): canonical AGPL sibling exception
[[licenses.exceptions]]
name = "alice-cache"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-codec"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-auth"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-physics"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-analytics"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# AGPL sibling path dep (canonical [[reference_alice_ci_canonical_template]] AGPL sibling exception)
# CI では MIT stub、local では実 crate (AGPL-3.0-or-later) が解決されるため両方許可
[[licenses.exceptions]]
name = "alice-crypto"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# AGPL sibling path dep (canonical [[reference_alice_ci_canonical_template]] AGPL sibling exception)
# CI では MIT stub、local では実 crate (AGPL-3.0-or-later) が解決されるため両方許可
[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# AGPL sibling path dep (canonical [[reference_alice_ci_canonical_template]] AGPL sibling exception)
# CI では MIT stub、local では実 crate (AGPL-3.0-or-later) が解決されるため両方許可
[[licenses.exceptions]]
name = "alice-ml"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
