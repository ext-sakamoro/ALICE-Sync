name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (no default features)
        run: cargo build --lib --no-default-features

      - name: Test (default = std)
        run: cargo test --features std

      - name: Build (async)
        run: cargo build --lib --features "async"

      - name: Build (simd)
        run: cargo build --lib --features "simd"

      - name: Build (cloud)
        run: cargo build --lib --features "cloud"

      # bridge 6 feature (physics / telemetry / cache / auth / codec / analytics) は
      # 2026-09-17 まで manifest-only stub (version 0.1.0 固定) で一度も compile されず、
      # stub の version が ^1 / ^0.5 を満たさなくなった 09-14 から CI red だった
      # sibling は全て crates.io 公開済なので version 依存にし、公開版 API で check する
      - name: Check (all features、bridge 含む)
        run: cargo check --lib --all-features

      - name: Doc tests
        run: cargo test --features std --doc

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (core features)
        run: cargo clippy --features std -- -W clippy::all

      - name: Clippy (cloud)
        run: cargo clippy --features cloud -- -W clippy::all

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
