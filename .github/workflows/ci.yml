name: CI

# the CI layout shared by the ALICE-* crates (based on ALICE-SDF's)
# 2026-09-17 ALICE-Sync 用: fmt / clippy -D / test (default + 全 native feature) /
# analytic oracle (feature-gated 3 種を必ず走らせる、strict-eval 16) / msrv 実 compile /
# doc -D warnings / feature-powerset / actionlint
# `python` (pyo3 extension-module) は build 環境依存のため対象外

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  # python を除く全 native feature (security-audit.yml と同じ定義)
  NATIVE_FEATURES: "std,async,simd,cloud,physics,telemetry,cache,auth,codec,analytics,ffi,serde-raw"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all native features)
        run: cargo clippy --all-targets --features "$NATIVE_FEATURES" -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings
      # ALICE-Law G13: the library code may not change a World / WorldSoA directly (events from
      # peers go through Node::apply_event, which makes the world independent of their order);
      # .github/clippy-lib/clippy.toml is the root list plus those entries, generated by
      # scripts/clippy_lib_gate.py, whose canary crate must get one diagnostic per entry
      - name: Clippy library configuration (tests)
        run: python3 scripts/test_clippy_lib_gate.py
      - name: Clippy library configuration (generated, canary flagged)
        run: python3 scripts/clippy_lib_gate.py
      # python: the Python bindings change a WorldSoA directly (single writer, no peer path), so
      # their allows are exercised here; only the library is checked, nothing is linked
      - name: Clippy library code (default, all native features, python)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: |
          cargo clippy --lib -- -D clippy::disallowed_methods -D clippy::disallowed_types
          cargo clippy --lib --features "$NATIVE_FEATURES" -- -D clippy::disallowed_methods -D clippy::disallowed_types
          cargo clippy --lib --features python -- -D clippy::disallowed_methods -D clippy::disallowed_types
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # G7 / G8: the boundary of the public API, enumerated from rustdoc JSON
      # (pinned toolchain, RUSTC_BOOTSTRAP=1), against scripts/api_boundary.toml
      - name: API boundary (tests)
        run: python3 scripts/test_api_boundary.py
      - name: API boundary (rustdoc JSON, every item decided)
        run: python3 scripts/api_boundary.py
      # G9: an identifier (SYNC_SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list (when it has one) and both values named in
      # CHANGELOG.md; the released value is read from the published crate at the newest
      # release tag (scripts/id_move_check.py, shared with the other ALICE crates). A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  test:
    name: Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (no default features)
        run: cargo build --lib --no-default-features
      # scripts/run_tests.sh fails the step when no test ran or when a named golden, identifier
      # or order test binary ran none (a feature or target mismatch would otherwise pass as an
      # empty run); the full suite still runs
      - name: Test (default = std)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,sync_semantics_id,g13_receive_order,g13_order_determinism -- cargo test
      - name: Test (all native features)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden,sync_semantics_id,g13_receive_order,g13_order_determinism -- cargo test --features "$NATIVE_FEATURES"
      # 解析解 oracle (tests/analytic_oracle.rs): feature-gated test (async / physics / codec)
      # を必ず走らせる
      - name: Analytic oracle (async + physics + codec)
        run: cargo test --test analytic_oracle --features "async,physics,codec"
      # G14: round-to-nearest-even and no flush-to-zero, asserted at run time
      # (scripts/run_tests.sh fails when the binary ran no test)
      - name: Float environment (debug)
        shell: bash
        run: scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_shared_files.py
          scripts/shared_files.sh
      - name: Doc tests
        run: cargo test --doc --features "$NATIVE_FEATURES"
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's, built with --locked): its own tests, then the check over src/ tests/
      # examples/ benches/ with the exact fma-call counts of
      # scripts/no-outer-fneg-of-fma-allowlist.toml (0 here); the IR half is g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        shell: bash
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .

  msrv:
    name: MSRV (rust-version = 1.88 実 compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 宣言値と同じ toolchain: Cargo.toml の rust-version を bump したら同 commit で @<version> も更新
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check (default + all native features)
        run: |
          cargo check --lib
          cargo check --lib --features "$NATIVE_FEATURES"

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features "$NATIVE_FEATURES"

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Check every feature pair (python 除外)
        run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features python --no-dev-deps

  entropy-guard:
    name: Entropy guard (no OS entropy / wall clock in src/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Entropy guard (tests)
        run: python3 scripts/test_entropy_guard.py
      - name: Entropy guard
        run: python3 scripts/entropy_guard.py
      # ALICE-Law G13: unspecified-order collections, threads, rayon / crossbeam in src/ and the
      # dependencies, each reviewed site listed with its line hashes and reason in
      # scripts/order_allowlist.toml (the clippy.toml bans are the type-resolved half)
      - name: Order guard (test, then check)
        run: |
          python3 scripts/test_order_guard.py
          python3 scripts/order_guard.py
      # G8: every serde type of src/ is behind serde-raw or listed non-durable
      - name: Serialize guard (tests)
        run: python3 scripts/test_serialize_guard.py
      - name: Serialize guard
        run: python3 scripts/serialize_guard.py
      # G7: every type-erasing entry point has a handshake decision
      - name: Boundary guard (tests)
        run: python3 scripts/test_boundary_guard.py
      - name: Boundary guard
        run: python3 scripts/boundary_guard.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          # the guard parses Cargo.toml with tomllib (Python 3.11+); this job has
          # no setup-python, so fail with exit 2 instead of skipping if it is missing
          python3 -c 'import sys, importlib.util as u; print(sys.version); sys.exit(0 if u.find_spec("tomllib") else 2)'
          python3 scripts/test_libm_dependency_guard.py
          python3 scripts/libm_dependency_guard.py
      # G14, static half: no fast-math-style flag, target-cpu=native or flag value
      # the guard cannot resolve in any file a flag can come from (deliberate
      # occurrences in scripts/build_config_allowlist.toml); nothing read fails.
      # The dynamic half's parser is tested here too (the check itself runs in
      # release-profile.yml)
      - name: Build configuration guard (test, then check)
        run: |
          python3 scripts/test_build_config_guard.py
          python3 scripts/build_config_guard.py
          python3 scripts/test_build_flags_check.py
      # scripts/run_tests.sh is what fails a test step that ran fewer tests than it names
      # (a binary that ran none, or fewer than its `=N` minimum); its own tests, run here
      - name: run_tests.sh (tests)
        run: python3 scripts/test_run_tests.py
      # scripts/changed_paths.py decides whether g3-ir.yml's heavy job runs (and its gate
      # job is red when that job was skipped); its own tests, run here
      - name: changed_paths.py (tests)
        run: python3 scripts/test_changed_paths.py

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
