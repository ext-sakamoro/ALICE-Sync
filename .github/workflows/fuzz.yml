name: Fuzz

# the CI layout shared by the ALICE-* crates
# ALICE-SDF v1.7.7 (commit 52d26f9) を ALICE-Codec 経由で ALICE-Sync 用に調整
#
# 目的:
# - 3 fuzz target を time-boxed 実行:
#   - fuzz_packet_decode: 任意 bytes の header / fragment decode + 再組立の panic-freedom
#   - fuzz_codec_bridge: decompress_event_batch (任意 bytes) + compress→decompress の panic-freedom
#   - fuzz_crdt_merge: 任意 op 列の CRDT merge が panic せず可換
#
# 罠:
# - cargo-fuzz は nightly toolchain 必須 (rust-toolchain 不使用時も明示指定)

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_packet_decode
          - fuzz_codec_bridge
          - fuzz_crdt_merge
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (job-level continue-on-error だと fuzz target の
      #  compile error が green 表示で silent になる)
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        # the input reaches the shell through env, not spliced into the script
        env:
          DURATION_INPUT: ${{ github.event.inputs.duration_seconds }}
        run: |
          DURATION="$DURATION_INPUT"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          # the job's timeout-minutes (30) also covers the build; a longer manual run
          # would be cut off mid-run, so refuse it here with a message instead
          # 1 to 4 digits without a leading zero, so the numeric test below cannot
          # error out (an overlong number makes `[ -gt ]` fail inside `if`, which
          # set -e ignores) and 0 (libFuzzer's "no limit") is refused
          case "$DURATION" in
            [1-9]|[1-9][0-9]|[1-9][0-9][0-9]|[1-9][0-9][0-9][0-9]) ;;
            *) echo "::error::duration_seconds must be a whole number of seconds from 1 to 1200, got '$DURATION'"; exit 1 ;;
          esac
          if [ "$DURATION" -gt 1200 ]; then
            echo "::error::duration_seconds must be at most 1200 (the job's timeout-minutes is 30), got $DURATION"
            exit 1
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # run は informational: crash 発見は block せず artifact で triage
      - name: Run fuzz target (time-boxed)
        id: run
        continue-on-error: true
        run: |
          cd fuzz
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }}

      - name: Upload crash artifacts (if any)
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash (informational)
        if: steps.run.outcome == 'failure'
        run: echo "::warning::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"
