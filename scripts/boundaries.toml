# scripts/boundary_guard.py (ALICE-Law G7): the type-erasing entry points of
# src/ and the handshake decision for each. `handshake: <test>` checks the
# peer's semantics identifier and names its mismatch test; `local: <reason>`
# says why no Law-bearing value from another producer crosses it.
