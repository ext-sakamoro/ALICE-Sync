# Per-repository data of scripts/clippy_lib_gate.py (the script is the same file in every
# repository that carries it): the library-only entries of .github/clippy-lib/clippy.toml and the
# canary forms, each with the path its disallowed-method diagnostic must name

header = """\
# Generated by scripts/clippy_lib_gate.py from clippy.toml (repository root):
# do not edit (python3 scripts/clippy_lib_gate.py --write)
#
# The library code (`cargo clippy --lib`, CLIPPY_CONF_DIR=.github/clippy-lib)
# also may not change a World or WorldSoA directly (ALICE-Law G13): events
# from peers go through Node::apply_event, whose src/converge.rs makes the world
# independent of their arrival order. The world types' own modules and the sink
# allow these calls at each site with a reason; tests, examples and benches use
# the repository-root clippy.toml configuration
"""
